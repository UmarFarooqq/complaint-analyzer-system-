<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Forgot Password - Complaint Analyzer System</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin-extra.css">
</head>
<body>
  <main class="auth-page premium-auth">
    <section class="auth-visual">
      <span class="auth-badge">Student Account Recovery</span>
      <h1>Recover your student portal access.</h1>
      <p>Enter your registered email address to receive a password reset link.</p>
      <a class="btn btn-light" href="login.html">← Back to Student Login</a>
    </section>

    <section class="auth-card-wrap">
      <div class="auth-card">
        <div class="auth-logo-large">CAS</div>
        <h2>Forgot Password</h2>
        <p>Reset your student account password.</p>

        <div id="forgotMessage" class="validation-message"></div>

        <form id="studentForgotPasswordForm" onsubmit="handleForgotPassword(event, 'student')">
          <div class="form-group">
            <label>Registered Email</label>
            <input id="recoveryEmail" type="email" placeholder="Enter your registered email" required>
            <div class="form-hint">Reset token will be valid for 15 minutes.</div>
          </div>

          <button class="btn btn-primary btn-full" type="submit">Generate Reset Link</button>
        </form>

        <div id="resetLinkBox" class="forgot-steps"></div>

        <div class="auth-footer">
          Remember password? <a href="login.html">Login</a>
        </div>
      </div>
    </section>
  </main>

  <script src="../assets/js/admin-ui.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>

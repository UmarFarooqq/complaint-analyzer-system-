<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Reset Password - Complaint Analyzer System</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin-extra.css">
</head>
<body>
  <main class="auth-page premium-auth">
    <section class="auth-visual">
      <span class="auth-badge">Admin Reset Password</span>
      <h1>Create your new password.</h1>
      <p>Choose a new password for your account.</p>
      <a class="btn btn-light" href="admin-login.html">← Back to Login</a>
    </section>

    <section class="auth-card-wrap">
      <div class="auth-card">
        <div class="auth-logo-large">CAS</div>
        <h2>Reset Password</h2>
        <p>Set a new password.</p>

        <div id="resetMessage" class="validation-message"></div>

        <form id="adminResetPasswordForm" onsubmit="handleResetPassword(event, 'admin')">
          <div class="form-group">
            <label>Reset Token</label>
            <input id="resetToken" type="text" placeholder="Paste reset token" required>
          </div>

          <div class="form-group">
            <label>New Password</label>
            <div class="password-field">
              <input id="newPassword" type="password" placeholder="Enter new password" required>
              <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">👁</button>
            </div>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <div class="password-field">
              <input id="confirmPassword" type="password" placeholder="Confirm new password" required>
              <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁</button>
            </div>
          </div>

          <button class="btn btn-primary btn-full" type="submit">Reset Password</button>
        </form>
      </div>
    </section>
  </main>

  <script src="../assets/js/admin-ui.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
